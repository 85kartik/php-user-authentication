services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_USER: auth_app
      DB_PASSWORD: local-dev-only
      DB_NAME: auth_demo
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: auth_demo
      MYSQL_USER: auth_app
      MYSQL_PASSWORD: local-dev-only
    volumes:
      - database:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1 FROM users LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  database:
